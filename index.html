<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Music Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#f5f5f7;--side:#ebebee;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.1);--accent:#fa2d48;--row:rgba(0,0,0,.05);--bar:rgba(255,255,255,.88);--dyn:#fa2d48}
[data-theme=dark]{--bg:#1c1c1e;--side:#161618;--text:#f5f5f7;--sub:#98989f;--line:rgba(255,255,255,.12);--row:rgba(255,255,255,.07);--bar:rgba(40,40,44,.88)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
select{background:var(--row);border-radius:6px;padding:6px 8px}
input[type=search],dialog input:not([type]){width:100%;border:0;border-radius:8px;padding:8px 10px;background:var(--row);color:var(--text);font:inherit}
input[type=range]{accent-color:var(--accent);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
#app{display:grid;grid-template-columns:220px 1fr 0;grid-template-rows:1fr 72px;height:100%;transition:grid-template-columns .3s}
.q #app{grid-template-columns:220px 1fr 300px}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.logo{font-size:15px;margin:0 8px 4px}
.ni{padding:7px 10px;border-radius:8px;color:var(--sub);font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:var(--row)}.ni.on{background:var(--row);color:var(--accent)}
.btn,.pri{background:var(--accent);color:#fff;border-radius:8px;padding:9px 12px;font-weight:600;text-align:center}
.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button,.pill{background:var(--row);border-radius:8px;padding:6px 10px;font-weight:600}
main{overflow:auto;min-width:0}
.hd{padding:24px 20px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2{margin:0;font-size:28px;letter-spacing:-.02em;flex:1 1 100%}.sub,small{color:var(--sub)}
.hd .pill.acc{background:var(--accent);color:#fff}
.r{display:grid;grid-template-columns:44px 1.6fr 1fr 1fr 30px 48px 30px;gap:10px;align-items:center;padding:6px 20px;cursor:pointer}
.r:nth-child(even){background:var(--row)}.r.h{color:var(--sub);font-size:12px;cursor:default;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.r.h span[data-s]{cursor:pointer}.r.on .t{color:var(--accent)}
.r>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t{font-weight:600}
.art{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;background-size:cover}
.hb{font-size:16px;color:var(--sub);text-align:center}.hb.on{color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:8px 20px}
.card{background:var(--row);border-radius:10px;padding:14px}.card b{font-size:22px;display:block}
h3.pad{margin:18px 20px 6px}.chart{display:flex;gap:8px;height:130px;align-items:flex-end;padding:0 20px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.col i{width:100%;max-width:40px;background:var(--accent);border-radius:4px 4px 0 0}
.srow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:7px 20px;cursor:pointer}.srow:hover{background:var(--row)}
#qp{overflow:hidden;background:var(--side);border-left:1px solid var(--line)}#qp>*{min-width:300px}
.qh{display:flex;justify-content:space-between;padding:16px;align-items:center}.qh button{padding:4px 8px;font-weight:600}
#qb{overflow:auto;height:calc(100% - 56px);padding:0 8px 12px}.qs{padding:12px 8px 4px;font-weight:700;display:flex;justify-content:space-between}
.qr{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer}.qr:hover{background:var(--row)}.qr .w{flex:1;min-width:0}.qr .w>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
#bar{grid-column:1/-1;background:var(--bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:16px;padding:0 16px;z-index:30}
.mini{display:flex;gap:10px;align-items:center;min-width:0}.mt{min-width:0}.mt>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bl.on{color:var(--accent)}.ctr{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctl{display:flex;align-items:center;gap:8px}.ctl button{width:34px;height:34px;border-radius:50%;font-size:18px}.ctl .big{width:42px;height:42px;font-size:22px}.on{color:var(--accent)}
.sk{display:flex;gap:8px;align-items:center;width:100%;max-width:440px;font-size:11px;color:var(--sub)}.sk input{flex:1}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:10px}.rt button{font-size:17px;padding:4px}.rt input{width:90px}
#np{position:fixed;inset:0 0 72px 0;z-index:20;display:none;overflow:auto;background:linear-gradient(var(--dyn),var(--bg) 85%)}#np.show{display:block}
#npc{max-width:900px;margin:0 auto;padding:60px 28px 30px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
#cov{width:100%;max-width:380px;aspect-ratio:1;height:auto;border-radius:12px;margin:auto;font-size:80px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#npx{position:absolute;top:16px;left:18px;background:var(--bar);width:36px;height:36px;border-radius:50%}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--bar);padding:14px;border-radius:12px;margin:12px 0}dt{color:var(--sub)}dd{margin:0;word-break:break-word}
#menu{position:fixed;display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:210px;max-height:70vh;overflow:auto;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.mi{padding:8px 12px;border-radius:5px;cursor:pointer}.mi:hover{background:var(--row)}.mi.dn{color:#e5484d}.ml{padding:6px 12px 2px;font-size:11px;color:var(--sub)}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 4px}.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.acts button{padding:8px 14px;font-weight:600}
.sh{margin:20px 0 6px;font-weight:700;font-size:15px;padding-top:14px;border-top:1px solid var(--line)}.sh:first-of-type{border-top:0;padding-top:0;margin-top:12px}
.note{color:var(--sub);font-size:12px;margin:4px 0}
.eqg{display:grid;grid-template-columns:repeat(10,1fr);text-align:center;font-size:11px;color:var(--sub);margin:10px 0}.eqg input{writing-mode:vertical-lr;direction:rtl;height:120px}
.kg{display:grid;grid-template-columns:1fr auto;gap:6px 14px}kbd{background:var(--row);border-radius:4px;padding:2px 7px;font:600 12px system-ui}
.row2{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.row2 select{margin-left:auto}
.dgr{color:#e5484d}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}#toast.show{opacity:1}
@media(max-width:760px){#app{grid-template-columns:1fr!important;grid-template-rows:auto 1fr 72px}aside{flex-direction:row;align-items:center;overflow-x:auto;padding:10px}#gs{min-width:140px}#nav{display:flex;gap:4px}
.r{grid-template-columns:44px 1fr 30px 48px 30px}.ca,.cb{display:none}#bar{grid-template-columns:1fr auto}.rt{display:none}#npc{grid-template-columns:1fr}#qp{position:fixed;inset:0 0 72px 0;z-index:25;display:none}.q #qp{display:block}}
</style></head>
<body>
<div id="app">
<aside><b class="logo">Local Music</b><input id="gs" type="search" placeholder="Search" aria-label="Search">
<div id="nav"></div><button class="btn" id="add">Import music</button><input id="file" type="file" accept="audio/*" multiple hidden>
<div class="tools"><button id="npl">＋ Playlist</button><button id="setb">⚙ Settings</button></div></aside>
<main id="main"></main>
<section id="qp"><div class="qh"><b>Queue</b><span><button id="qsave">Save as playlist</button><button id="qx">✕</button></span></div><div id="qb"></div></section>
<footer id="bar">
<div class="mini"><div class="art" id="bart">♪</div><div class="mt"><b id="bt">Not playing</b><small id="ba">Import songs to begin</small></div><button id="bl" aria-label="Like">♡</button></div>
<div class="ctr"><div class="ctl"><button id="sh" aria-label="Shuffle">⇄</button>
